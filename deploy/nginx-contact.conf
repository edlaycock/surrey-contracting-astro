# contact.surreycontracting.co.uk: retired landing-page subdomain.
# Every path 301s to the main site; query strings (gclid, utm_*) preserved.
# Install (once, by hand on the VPS): see docs/contact-subdomain-redirect.md
map $uri $contact_redirect {
    default                      https://surreycontracting.co.uk/;
    ~*^/demolition/?$            https://surreycontracting.co.uk/lp/demolition-2;
    ~*^/groundworks/?$           https://surreycontracting.co.uk/lp/groundworks-2;
    ~*^/earthworks/?$            https://surreycontracting.co.uk/lp/earthworks-2;
    ~*^/surfacing-commercial/?$  https://surreycontracting.co.uk/;
}

server {
    listen 80;
    listen [::]:80;
    server_name contact.surreycontracting.co.uk;
    # Inside a location (not server level) so certbot's ACME challenge location keeps working.
    location / {
        return 301 $contact_redirect$is_args$args;
    }
}
