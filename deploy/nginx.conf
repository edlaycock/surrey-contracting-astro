# Surrey Contracting — nginx vhost (system nginx on the VPS).
# Proxies the public domain to the app's localhost port; TLS managed by certbot.
#
# LIVE LOCATION: /etc/nginx/conf.d/surreycontracting.conf
# (NOT sites-available/sites-enabled — earlier docs said otherwise and were wrong.)
#
# This file is a faithful copy of the deployed config as at 11 Aug 2026. Nothing
# in the deploy pipeline touches nginx: GitHub Actions only rsyncs source and
# rebuilds the Docker container. nginx changes are manual, over SSH.
#
#   sudo cp /etc/nginx/conf.d/surreycontracting.conf /etc/nginx/conf.d/surreycontracting.conf.bak-$(date +%F)
#   sudo tee /etc/nginx/conf.d/surreycontracting.conf < deploy/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── WARNING: certbot silently breaks the www redirect ──────────────────────
# Running:
#     certbot --nginx -d surreycontracting.co.uk -d www.surreycontracting.co.uk
# merges BOTH hostnames onto the :443 server block and rewrites the :80 redirect
# to use $host. The result is that https://www.surreycontracting.co.uk serves the
# entire site with HTTP 200 instead of redirecting, and http://www is forwarded
# onto https://www rather than to the canonical hostname.
#
# This happened. Found 11 Aug 2026 while investigating why only 14 of 24 pages
# were indexed. Google was crawling every page on both hostnames and filing the
# www copies under "Alternate page with proper canonical tag" in Search Console,
# burning crawl budget on a new site. The canonical tags in BaseLayout.astro
# always point at the apex, so there was never a duplicate-content penalty, but
# the crawl cost was doubled. Fixed and verified the same day.
#
# After ANY certbot run or certificate renewal, verify:
#     curl -sI https://www.surreycontracting.co.uk/services | head -1
#     # expect: HTTP/2 301   (NOT 200)
# ───────────────────────────────────────────────────────────────────────────
#
# NOTE ON TRAILING SLASHES: there is deliberately no trailing-slash redirect in
# here. Astro's `trailingSlash: 'never'` handles it inside the Node server, so
# /services/ already 301s to /services without nginx being involved.

# 1. HTTPS apex — the real site.
#    server_name must be the apex ONLY. Adding www here re-creates the bug above.
server {
    server_name surreycontracting.co.uk;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/surreycontracting.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/surreycontracting.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. HTTPS www → HTTPS apex (301).
#    The certificate is a SAN cert covering both hostnames, so it is reused here.
server {
    server_name www.surreycontracting.co.uk;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/surreycontracting.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surreycontracting.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://surreycontracting.co.uk$request_uri;
}

# 3. HTTP (both hostnames) → HTTPS apex.
#    Redirect targets are the apex EXPLICITLY. Certbot's default is
#    `https://$host$request_uri`, which sends http://www traffic to https://www
#    instead of to the canonical hostname. Certbot's if/404 structure is kept so
#    that renewals recognise the block and are less likely to rewrite it wholesale.
server {
    if ($host = www.surreycontracting.co.uk) {
        return 301 https://surreycontracting.co.uk$request_uri;
    } # managed by Certbot

    if ($host = surreycontracting.co.uk) {
        return 301 https://surreycontracting.co.uk$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name surreycontracting.co.uk www.surreycontracting.co.uk;
    return 404; # managed by Certbot
}
