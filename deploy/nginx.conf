# Surrey Contracting — nginx vhost (system nginx on the VPS).
#
# Update live config:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/surreycontracting
#   sudo ln -sf /etc/nginx/sites-available/surreycontracting /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── IMPORTANT: certbot and the www redirect ────────────────────────────────
# Certbot's --nginx plugin rewrites these blocks when it issues or renews a
# certificate. Running it as:
#     certbot --nginx -d surreycontracting.co.uk -d www.surreycontracting.co.uk
# can merge BOTH hostnames onto a single 443 server block. That silently drops
# the www → apex redirect on HTTPS, and the entire site starts serving on two
# hostnames.
#
# This has already happened once. Found 11 Aug 2026:
# https://www.surreycontracting.co.uk/services returned HTTP 200 with identical
# content to the apex instead of redirecting. Google was crawling every page
# twice and filing the www copies under "Alternate page with proper canonical
# tag" in Search Console, wasting crawl budget on a new site.
#
# The canonical tags in BaseLayout.astro always point at the apex, so this never
# caused duplicate-content penalties. It just doubled the crawl cost.
#
# After ANY certbot run, verify:
#     curl -sI https://www.surreycontracting.co.uk/services | head -1
#     # expect: HTTP/2 301   (NOT 200)
# ───────────────────────────────────────────────────────────────────────────

# 1. HTTP apex → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name surreycontracting.co.uk;
    return 301 https://surreycontracting.co.uk$request_uri;
}

# 2. HTTP www → HTTPS apex (single hop, not via https://www)
server {
    listen 80;
    listen [::]:80;
    server_name www.surreycontracting.co.uk;
    return 301 https://surreycontracting.co.uk$request_uri;
}

# 3. HTTPS www → HTTPS apex
#    This block is the one certbot tends to swallow. It must stay separate from
#    the block below, and www must NOT appear on that block's server_name.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.surreycontracting.co.uk;

    # Managed by certbot — paths must match what it actually created.
    ssl_certificate     /etc/letsencrypt/live/surreycontracting.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surreycontracting.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://surreycontracting.co.uk$request_uri;
}

# 4. HTTPS apex — the real site. Proxies to the Docker container on 4321.
#    server_name is the apex ONLY. Adding www here re-creates the bug above.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name surreycontracting.co.uk;

    # Managed by certbot — paths must match what it actually created.
    ssl_certificate     /etc/letsencrypt/live/surreycontracting.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surreycontracting.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Trailing slash → no trailing slash. Matches trailingSlash: 'never' in
    # astro.config.mjs, so both agree on one canonical URL form.
    location ~ ^(.+)/$ {
        return 301 https://surreycontracting.co.uk$1;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
