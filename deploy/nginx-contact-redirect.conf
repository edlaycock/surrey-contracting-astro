# contact.surreycontracting.co.uk: retired landing-page subdomain (nginx vhost on the VPS).
#
# The old landing pages on this subdomain were hosted by the previous agency's
# tool (157.53.227.1). Ads and any saved links still point at them, so every
# path 301s to the matching page on the main site, keeping the query string so
# gclid and UTM parameters survive. Anything else goes to the homepage.
#
# Kept separate from deploy/nginx.conf so installing it never overwrites the
# certbot-managed TLS sections of the live main-site config.
#
# Only works once DNS for `contact` points at this VPS. Install and TLS steps:
# see "Retiring contact.surreycontracting.co.uk" in DEPLOY.md.
#   sudo cp deploy/nginx-contact-redirect.conf /etc/nginx/conf.d/contact-surreycontracting.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --no-redirect -d contact.surreycontracting.co.uk
#
# certbot adds the 443 listener and certificate lines to this block. With
# --no-redirect, HTTP and HTTPS both go straight to the final https URL in one
# hop, so no separate HTTP to HTTPS block is needed.

server {
    listen 80;
    listen [::]:80;
    server_name contact.surreycontracting.co.uk;

    # /groundworks, /demolition, /earthworks, /drainage, /agricultural,
    # with or without a trailing slash, to the matching /lp/ page.
    location ~ ^/(groundworks|demolition|earthworks|drainage|agricultural)/?$ {
        return 301 https://surreycontracting.co.uk/lp/$1$is_args$args;
    }

    # Old commercial surfacing page. Surfacing is no longer offered; matches
    # the main site, where /surfacing and /lp/surfacing go to /groundworks.
    location ~ ^/(surfacing-commercial|surfacing)/?$ {
        return 301 https://surreycontracting.co.uk/groundworks$is_args$args;
    }

    # Root and every other path: homepage, query string kept.
    location / {
        return 301 https://surreycontracting.co.uk/$is_args$args;
    }
}
