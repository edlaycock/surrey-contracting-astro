name: Build & deploy to VPS

on:
  push:
    branches: [main]
  # Sanity webhook -> repository_dispatch fires this so client publishes rebuild
  repository_dispatch:
    types: [sanity-publish]
  # Manual run. With ytq_claim_code set it also installs the YourTradeQuotes
  # secret key on the server (scripts/ytq-connect.sh, DEPLOY.md). Empty, it is
  # an ordinary deploy, exactly as a push or a Sanity publish.
  workflow_dispatch:
    inputs:
      ytq_claim_code:
        description: 'One-time YourTradeQuotes claim code from System Admin. Leave empty for a normal deploy.'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Map secret to env so it can be referenced in step `if:` conditions
    # (the `secrets` context is not allowed directly in `if`).
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      # YourTradeQuotes claim code: read from the event payload (so it never
      # appears in a step's env header), masked before any step that logs, and
      # handed to the SSH step. Only manual runs can carry one.
      - name: Read the YourTradeQuotes claim code
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          code="$(jq -r '.inputs.ytq_claim_code // ""' "$GITHUB_EVENT_PATH")"
          if [ -n "$code" ]; then
            echo "::add-mask::$code"
            echo "YTQ_CLAIM_CODE=$code" >> "$GITHUB_ENV"
            echo "A YourTradeQuotes claim code was supplied; the server will exchange it."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: mhqgpyb9
          PUBLIC_SANITY_DATASET: production

      # Ship source to the VPS; the Docker image is built there.
      # --exclude=.env protects the server-only secrets file from --delete.
      # This step also delivers scripts/ytq-connect.sh, which the next step runs.
      - name: Rsync source to VPS
        if: ${{ env.SSH_HOST != '' }}
        uses: burnett01/rsync-deployments@155b6d6c1219ab2224c20c58d423a3f1b850395f # v9
        with:
          switches: -avzr --delete --exclude=.git --exclude=node_modules --exclude=dist --exclude=.astro --exclude=studio --exclude=.env
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Build & (re)start the isolated container
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          YTQ_CLAIM_CODE: ${{ env.YTQ_CLAIM_CODE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: YTQ_CLAIM_CODE
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # YourTradeQuotes: FIRST in the remote script, after the rsync step
            # above has delivered the script. Spends the claim code before the
            # long image build, while it is inside its 15 minutes, so the
            # container starts with the new key. No code: exits 0, changes nothing.
            bash scripts/ytq-connect.sh install
            # Passed through to the Dockerfile's BUILD_ID arg so the Astro build layer
            # is never served from cache — otherwise a deploy with no source change
            # rebuilds the container from a stale dist and CMS edits never appear.
            # Must be unique per run, not per commit: Sanity webhook and manual runs
            # reuse the last commit SHA, so the SHA alone still hits the cache.
            export BUILD_ID="${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            docker compose up -d --build
            docker compose ps
            # Proves the installed key works; fails the step if not. No code: no-op.
            bash scripts/ytq-connect.sh ping

      # Confirm the public site serves after the restart: key pages return 200 and an
      # unknown path returns the branded 404. Retries for ~90s while the container starts.
      - name: Verify key pages are live
        if: ${{ env.SSH_HOST != '' }}
        env:
          BASE: https://surreycontracting.co.uk
          MISSING: /this-page-does-not-exist-${{ github.run_id }}
        run: |
          check() {
            ok=0
            for p in / /lp/demolition-2 /lp/groundworks-2 /lp/earthworks-2 /lp/demolition /lp/groundworks /lp/earthworks; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE$p") || true
              echo "$code $p"; [ "$code" = 200 ] || ok=1
            done
            # Thank-you page for every landing page (generated from src/pages/lp/*.astro).
            for f in src/pages/lp/*.astro; do
              p="/lp/$(basename "$f" .astro)/thanks"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE$p") || true
              echo "$code $p"; [ "$code" = 200 ] || ok=1
            done
            # TruConversion masking is on the live landing-page forms.
            for p in /lp/groundworks /lp/groundworks-2; do
              n=$(curl -sS --max-time 10 "$BASE$p" | grep -o 'data-tc-masked' | wc -l) || true
              echo "$n data-tc-masked on $p"; [ "$n" -ge 6 ] || ok=1
            done
            code=$(curl -sS -o nf.html -w '%{http_code}' --max-time 10 "$BASE$MISSING") || true
            grep -q 'This page took a wrong turn' nf.html 2>/dev/null && body=branded || body=unbranded
            echo "$code $MISSING ($body)"; [ "$code" = 404 ] && [ "$body" = branded ] || ok=1
            return $ok
          }
          for i in $(seq 1 9); do
            echo "Attempt $i"; check && exit 0; sleep 10
          done
          echo "Post-deploy page checks failed"; exit 1
