# Surrey Contracting — isolated app container.
# Binds ONLY to 127.0.0.1:4321 (nginx proxies the public domain to it).
# Does not join any shared network, does not touch 80/443, no shared volumes.
# One named volume of its own: the YourTradeQuotes case-study store, which
# must survive a rebuild (the image is rebuilt on every deploy).
services:
  surrey-contracting:
    build:
      context: .
      args:
        # Set per deploy (the workflow exports SHA-run_id-run_attempt) so the Astro build
        # layer always re-runs and picks up current CMS content.
        BUILD_ID: "${BUILD_ID:-dev}"
    container_name: surrey-contracting
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: "production"
      YTQ_CASE_STUDY_DIR: "/data/ytq-case-studies"
    volumes:
      - ytq-case-studies:/data/ytq-case-studies

volumes:
  ytq-case-studies:
